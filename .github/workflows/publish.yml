name: 🧬 Publish Version

# Manual, intentional release. Each job owns one thing, ordered so nothing
# outward-facing happens until every artifact it refers to exists:
#
#   test    → the full 3.11 → 3.14 matrix; gates everything below
#   version → a final rolls CHANGELOG [Unreleased], commits + tags on main; an rc
#             only tags its branch head (no commit). The ONLY job
#             that writes a file or a tag; it emits the tag used downstream.
#   package → check out that tag and build the sdist + wheel → GHA artifact
#   pypi    → upload that artifact to PyPI
#   release → attach the same artifact to the GitHub Release
#
# PyPI uses trusted publishing, which PyPI binds to THIS file name and the
# `pypi` environment — so the upload is a job here, never inside a called
# workflow, and renaming this file breaks publishing until PyPI is updated.
#
# Run once with push=false (a dry run: tests, the next version, and both builds,
# nothing pushed), then push=true. A failed build after a successful tag strands
# a tag that never reached PyPI, which is what the dry run buys.
#
# Auth for the version job: tokenless WIF → GCP Secret Manager → the kubed.io
# GitHub App creds, which let the version job commit and tag on main.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Version to bump to
        default: patch
        type: choice
        options:
        - patch
        - minor
        - major
        # a release candidate, X.Y.Z-rc.N (pip reads X.Y.ZrcN), from any ref
        - prerelease
      # npm's pre* bumps are gone: `0.2.0-0` is `0.2.0.post0` to pip, a final release
      candidate:
        description: For prerelease, the release it is a candidate for
        default: minor
        type: choice
        options:
        - patch
        - minor
        - major
      push:
        description: Push changes and create release
        default: false
        type: boolean
  # a merge to main releases at its PR's release:patch|minor|major label (spec 2026-11-24 R-UR2);
  # a push whose PR has no such label, or no PR at all (version-bump's own commit), releases nothing
  push:
    branches:
    - main

permissions:
  contents: read

jobs:

  # The run's values, from the context: a manual run's inputs, or a merge's PR label. Every job
  # below reads these, never inputs.*, so a push run and a manual one take the same path.
  decide:
    name: Decide
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      action: ${{ steps.decide.outputs.action }}
      candidate: ${{ steps.decide.outputs.candidate }}
      push: ${{ steps.decide.outputs.push }}
    steps:
    - name: Decide
      id: decide
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ inputs.action }}
        CANDIDATE: ${{ inputs.candidate }}
        PUSH: ${{ inputs.push }}
      run: |
        if [[ "$EVENT" == workflow_dispatch ]]; then
          { echo "release=true"; echo "action=$ACTION"; echo "candidate=$CANDIDATE"; echo "push=$PUSH"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
          --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].labels // [] | [.[].name | select(startswith("release:"))] | join(" ")')
        read -r -a levels <<< "$labels"
        if (( ${#levels[@]} == 0 )); then
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "No release label on the merged PR of $GITHUB_SHA: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if (( ${#levels[@]} > 1 )); then
          echo "::error::The merged PR of $GITHUB_SHA has several release labels (${levels[*]}): keep one."
          exit 1
        fi
        level=${levels[0]#release:}
        case "$level" in patch|minor|major) ;; *) echo "::error::Unknown release label release:$level"; exit 1 ;; esac
        { echo "release=true"; echo "action=$level"; echo "candidate=$level"; echo "push=true"; } >> "$GITHUB_OUTPUT"
        echo "Releasing a $level for the merge of $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: decide
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/test.yml
    # A called job gets no more than its caller grants, and test.yml's results
    # job asks for these to post its check run.
    permissions:
      contents: read
      checks: write
      pull-requests: write

  version:
    name: Version
    needs: [decide, test]
    runs-on: ubuntu-26.04
    # one release at a time; a manual run and a merge's run never write the same tag together
    concurrency:
      group: publish-version
      cancel-in-progress: false
    permissions:
      contents: write   # a final: commit the rolled CHANGELOG and tag; an rc: the tag only
      id-token: write   # GCP workload-identity federation, for the App token
    # No release-notes output: GitHub drops a job output that contains a
    # registered secret's substring (`kubed-io` is in every PR link), silently.
    # The notes travel as an artifact instead.
    outputs:
      tag: ${{ steps.bump.outputs.tag || steps.preview.outputs.tag }}
      version: ${{ steps.bump.outputs.version || steps.preview.outputs.version }}
    steps:

    # Only a prerelease may push from another ref, a family branch say, so downstream can
    # adopt an epic before its family PR merges. patch, minor and major push from main.
    - name: Validate Branch
      if: needs.decide.outputs.push == 'true' && needs.decide.outputs.action != 'prerelease'
      env:
        REF: ${{ github.ref_name }}
      run: |
        if [[ "$REF" != "main" ]]; then
          echo "::error::Releases can only be pushed from main. Current ref: $REF"
          exit 1
        fi

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: github@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com

    # github-app = kubed.io app creds (JSON: github_app_client_id /
    # github_app_private_key) pushed by apps/github/providers/gcp.
    - name: Get secrets
      id: secrets
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: |-
          github_app:${{ vars.GCP_PROJECT }}/github-app

    - name: Mint kubed.io app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ fromJson(steps.secrets.outputs.github_app).github_app_client_id }}
        private-key: ${{ fromJson(steps.secrets.outputs.github_app).github_app_private_key }}
        permission-contents: write

    # Nothing here pushes through git: version-bump writes through the API with
    # the App token, so the checkout keeps no credential.
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # The candidate's version: the next X.Y.Z from the last release by `candidate`, then
    # -rc.N, one past the highest candidate tagged for that X.Y.Z.
    - name: Next Candidate
      id: candidate
      if: needs.decide.outputs.action == 'prerelease'
      env:
        BUMP: ${{ needs.decide.outputs.candidate }}
      run: |
        last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
        IFS=. read -r major minor patch <<< "${last:-0.0.0}"
        case "$BUMP" in
          major) base="$((major + 1)).0.0" ;;
          minor) base="$major.$((minor + 1)).0" ;;
          *) base="$major.$minor.$((patch + 1))" ;;
        esac
        n=$(git tag -l "v$base-rc.*" | sed "s/^v$base-rc\.//" | sort -n | tail -1)
        version="$base-rc.$(( ${n:-0} + 1 ))"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Release candidate: $version (after v${last:-none})" >> "$GITHUB_STEP_SUMMARY"

    # version-bump with push false only works the version and the notes out, and writes
    # nothing. Every run previews first, so the guard sees the version before anything lands.
    - name: Preview the Version
      id: preview
      uses: duplocloud/version-bump@main
      with:
        version: ${{ steps.candidate.outputs.version || needs.decide.outputs.action }}
        push: false
        token: ${{ steps.app-token.outputs.token }}

    # One rc line per repository (spec 2026-11-24 R-UR20). version-bump reads its last
    # version from every tag, rcs included, so while one epic's rcs are out nothing else
    # may release: a patch beside v0.2.0-rc.1 would come out as 0.2.0. A final must be the
    # next version from the last final tag (R-UR18), and an rc must not start a second line.
    - name: Guard the Release
      env:
        ACTION: ${{ needs.decide.outputs.action }}
        VERSION: ${{ steps.preview.outputs.version }}
      run: |
        last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
        last=${last:-0.0.0}
        # rc tags above the last final: an open rc line
        open=$(git tag -l 'v*-rc.*' | sed 's/^v//' | while read -r t; do
          base=${t%%-*}
          [[ "$(printf '%s\n%s\n' "$last" "$base" | sort -V | tail -1)" == "$base" && "$base" != "$last" ]] && echo "$t"
        done | sort -V)
        if [[ "$ACTION" == prerelease ]]; then
          for t in $open; do
            if [[ "${t%%-*}" != "${VERSION%%-*}" ]] || ! git merge-base --is-ancestor "v$t" HEAD; then
              echo "::error::Another rc line is open (v$t, not on this branch). One epic at a time may pre-release; this one waits for that line's final."
              exit 1
            fi
          done
          exit 0
        fi
        for t in $open; do
          if [[ "${t%%-*}" != "$VERSION" ]]; then
            echo "::error::An rc line is open (v$t), so only its own final, ${t%%-*}, may release now; this $ACTION would release $VERSION."
            exit 1
          fi
        done
        IFS=. read -r major minor patch <<< "$last"
        case "$ACTION" in
          major) want="$((major + 1)).0.0" ;;
          minor) want="$major.$((minor + 1)).0" ;;
          *) want="$major.$minor.$((patch + 1))" ;;
        esac
        if [[ "$VERSION" != "$want" ]]; then
          echo "::error::This $ACTION would release $VERSION, but the next $ACTION after v$last is $want. Open rc tags: ${open:-none}. While an rc line is open only its own final may release, at the level its rcs were cut for."
          exit 1
        fi

    # Only a final writes through version-bump: it rolls CHANGELOG [Unreleased] and tags.
    - name: Bump Version
      id: bump
      if: needs.decide.outputs.action != 'prerelease'
      uses: duplocloud/version-bump@main
      with:
        version: ${{ needs.decide.outputs.action }}
        push: ${{ needs.decide.outputs.push }}
        token: ${{ steps.app-token.outputs.token }}

    # An rc leaves the changelog alone (R-UR17): no commit, just the tag on this branch's
    # head, made before the package job checks it out, since setuptools_scm reads its
    # version from the tag.
    - name: Tag the Candidate
      if: needs.decide.outputs.action == 'prerelease' && needs.decide.outputs.push == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        TAG: ${{ steps.preview.outputs.tag }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq .ref
        echo "Tagged $TAG at $GITHUB_SHA, CHANGELOG untouched." >> "$GITHUB_STEP_SUMMARY"

    # Empty notes are a hard failure: they ARE the release, and an empty body
    # sails through a green run unnoticed.
    - name: Save the Release Notes
      env:
        NOTES: ${{ steps.bump.outputs.release-notes || steps.preview.outputs.release-notes }}
      run: |
        mkdir -p notes
        printf '%s\n' "$NOTES" > notes/release-notes.md
        if [[ ! -s notes/release-notes.md || -z "$(tr -d '[:space:]' < notes/release-notes.md)" ]]; then
          echo "::error::The release notes came back empty, so this fails rather than publishing a release without them."
          exit 1
        fi
        echo "Release notes: $(wc -l < notes/release-notes.md) lines." >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the Release Notes
      uses: actions/upload-artifact@v7
      with:
        name: release-notes
        path: notes/release-notes.md
        retention-days: 1

  # On a dry run there is no tag, so it builds the current ref.
  package:
    name: Package
    needs: [decide, version]
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.decide.outputs.push == 'true' && needs.version.outputs.tag || '' }}

  pypi:
    name: PyPI
    needs: [decide, package]
    if: needs.decide.outputs.push == 'true'
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/kubed-mcp
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing
    steps:

    - name: Download Package
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.package.outputs.package }}
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Release
    needs:
    - decide
    - version
    - package
    - pypi
    if: needs.decide.outputs.push == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # create the GitHub Release on the existing tag
    steps:

    - name: Download Package
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.package.outputs.package }}
        path: dist

    - name: Download the Release Notes
      uses: actions/download-artifact@v8
      with:
        name: release-notes
        path: notes

    - name: Compose the Release Body
      env:
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        VERSION: ${{ needs.package.outputs.version }}
      run: |
        {
          echo "[![Publish](${SERVER}/${REPO}/actions/workflows/publish.yml/badge.svg)](${SERVER}/${REPO}/actions/runs/${RUN_ID})"
          echo "[![Test](${SERVER}/${REPO}/actions/workflows/test.yml/badge.svg)](${SERVER}/${REPO}/actions/workflows/test.yml)"
          echo "[![Quality](${SERVER}/${REPO}/actions/workflows/quality.yml/badge.svg)](${SERVER}/${REPO}/actions/workflows/quality.yml)"
          echo
          cat notes/release-notes.md
          echo
          echo "## Install"
          echo
          echo '```sh'
          echo "pip install kubed-mcp==${VERSION}"
          echo '```'
        } > body.md
        cat body.md >> "$GITHUB_STEP_SUMMARY"

    - name: Create Release
      uses: softprops/action-gh-release@v3.0.4
      with:
        name: ${{ needs.version.outputs.tag }}
        tag_name: ${{ needs.version.outputs.tag }}
        prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        body_path: body.md
        files: |
          dist/${{ needs.package.outputs.sdist }}
          dist/${{ needs.package.outputs.wheel }}
