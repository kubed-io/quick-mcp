name: 🗿 Package

# Builds the Python distribution (sdist + wheel) and nothing else, then saves it
# as a GHA artifact. It never bumps versions, tags, or publishes anywhere:
#
#   pull_request       the gate, called by pr.yml — proves the wheel still builds and installs
#   push: main         same, so the badge tracks trunk
#   workflow_dispatch  package an arbitrary ref
#   workflow_call      publish.yml passes the release tag, so the distribution is
#                      built from exactly the released commit; its pypi and
#                      release jobs upload this artifact, byte for byte
#
# The version is not an input: setuptools_scm derives it from git.

on:
  # pull requests: pr.yml calls this, with every other check, so one collector sees them all
  # (with no path filter: a required check that never reports blocks a PR forever)
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      tag:
        description: Git tag to check out and build — empty = the caller's ref
        type: string
        required: false
        default: ''
    outputs:
      version:
        description: Version built, as setuptools_scm resolved it from git
        value: ${{ jobs.package.outputs.version }}
      package:
        description: Name of the uploaded artifact holding the sdist + wheel
        value: ${{ jobs.package.outputs.package }}
      sdist:
        description: sdist file name
        value: ${{ jobs.package.outputs.sdist }}
      wheel:
        description: wheel file name
        value: ${{ jobs.package.outputs.wheel }}

permissions:
  contents: read

jobs:

  package:
    name: Package
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      package: ${{ steps.version.outputs.package }}
      sdist: ${{ steps.files.outputs.sdist }}
      wheel: ${{ steps.files.outputs.wheel }}
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}
        # A shallow clone silently yields a 0.1.devN version instead of the tag.
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install Build Dependencies
      run: pip install ".[build]"

    # Resolve the version BEFORE building, so a wrong one is caught here rather
    # than discovered as a confusingly-named file three steps later.
    - name: Resolve Version
      id: version
      run: |
        version="$(python -m setuptools_scm)"
        echo "Building version: $version"
        {
          echo "version=$version"
          echo "package=kubed_mcp-${version}"
        } >> "$GITHUB_OUTPUT"

    - name: Build
      run: python -m build

    # Names come from the files on disk: a wheel carries a Python tag the
    # version string does not.
    - name: Resolve Artifact Names
      id: files
      run: |
        {
          echo "sdist=$(basename dist/*.tar.gz)"
          echo "wheel=$(basename dist/*.whl)"
        } >> "$GITHUB_OUTPUT"
        ls -l dist

    - name: Check Distribution Metadata
      run: twine check --strict dist/*

    # A clean venv proves the wheel imports as kubed.mcp, reports the version it was
    # built as, and left `kubed` a namespace: a kubed/__init__.py in the wheel would
    # shadow every other kubed.* distribution installed beside it.
    - name: Verify the Wheel Installs
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python -m venv /tmp/verify
        /tmp/verify/bin/pip install --quiet "$(echo dist/*.whl)"
        /tmp/verify/bin/python - <<'EOF'
        import os
        import kubed
        import kubed.mcp
        assert getattr(kubed, "__file__", None) is None, "kubed is not a namespace package"
        assert kubed.mcp.__version__ == os.environ["VERSION"], kubed.mcp.__version__
        print("kubed.mcp", kubed.mcp.__version__)
        EOF

    - name: Upload Package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.version.outputs.package }}
        path: dist/
        if-no-files-found: error

    - name: Summary
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SDIST: ${{ steps.files.outputs.sdist }}
        WHEEL: ${{ steps.files.outputs.wheel }}
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<EOF
        ## Package

        - **Version**: \`${VERSION}\`
        - **sdist**: \`${SDIST}\`
        - **wheel**: \`${WHEEL}\`
        EOF
